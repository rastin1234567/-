<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایت من</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
    }

    nav {
      background: white;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 10px #ddd;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    nav a:hover {
      color: #2563eb;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 30px;
      margin-bottom: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #2563eb;
      margin-bottom: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .button:hover {
      background: #1d4ed8;
    }

    footer {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <h1></h1>
    <p></p>
  </header>

  <nav>
    <a href="#home">خانه</a>
    <a href="#about">درباره ما</a>
    <a href="#services">خدمات</a>
    <a href="#contact">تماس با ما</a>
  </nav>

  <div class="container">

    <section class="card" id="home">
      <h2>🏠 صفحه اصلی</h2>
      <p></p>
      <a href="#contact" class="button"></a>
    </section>

    <section class="card" id="about">
      <h2>ℹ️ درباره ما</h2>
      <p></p>
    </section>

    <section class="card" id="services">
      <h2>⭐ خدمات</h2>
      <p></p>
      <p></p>
      <p></p>
    </section>

    <section class="card" id="contact">
      <h2>📞 تماس با ما</h2>
      <p></p>
      <p></p>
    </section>

  </div>

  <footer>
    <p></p>
  </footer>

</body>
</html>
